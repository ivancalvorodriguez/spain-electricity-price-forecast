name: ci

on:
  push:
    branches: [main]
  # Solo comprueba: el despliegue se salta fuera de main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobaciones:
    # Fijado: ubuntu-latest pasa a Ubuntu 26.04 entre el 19 oct y el 19 nov de 2026
    runs-on: ubuntu-24.04
    # Tarda menos de un minuto (54 s el 23/11 con pytest; sin él, 16 s).
    # Sin tope, un paso colgado espera hasta 6 h
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # la de la imagen
          cache: pip
          cache-dependency-path: pyproject.toml
      # El grupo dev del pyproject: ruff (la misma versión que pre-commit), pytest
      # y psycopg, con las versiones fijadas ahí
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      # Postgres 18 de usar y tirar (tests/conftest.py): el runner ya trae Docker.
      # La imagen se baja en su propio paso, para ver en el registro cuánto tarda
      # la descarga y cuánto los tests
      - run: docker pull postgres:18
      - run: pytest -ra
      - name: Construir la imagen
        run: docker build --tag epf-spain:ci .

  desplegar:
    needs: comprobaciones
    # El push a main y el lanzamiento manual sobre main; nunca un PR ni otra rama
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Tarda unos 4 s. El 11/11 el gancho tardó 27 min en contestar, y con el
    # concurrency bloqueaba también los despliegues de detrás
    timeout-minutes: 5
    # El gancho vive en el entorno production, que GitHub limita a main
    environment:
      name: production
      url: https://epf-spain.onrender.com
    # Un despliegue detrás de otro, sin cancelar el que ya está en marcha
    concurrency:
      group: desplegar
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # Sin el secret del entorno, rojo: antes se saltaba en verde y no te enterabas
      - name: Llamar al gancho de Render
        # ref: el commit que acaba de pasar las comprobaciones, no el último de main.
        # --fail pone el trabajo en rojo si Render no responde 2xx; la URL no se imprime.
        # Un minuto por intento y dos reintentos: caben en los 5 min del trabajo.
        # --retry-all-errors porque el 11/11 llegó un 520 de Cloudflare, que --retry
        # solo no reintenta. Si Render recibe dos, encola dos despliegues del mismo
        # commit, sin daño
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL en el entorno production"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-all-errors \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
