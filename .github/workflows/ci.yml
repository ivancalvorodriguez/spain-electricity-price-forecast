name: ci

on:
  push:
    branches: [main]
  # Solo comprueba: el despliegue se salta fuera de main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobaciones:
    # Fijado: ubuntu-latest pasa a Ubuntu 26.04 entre el 19 oct y el 19 nov de 2026
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # la de la imagen
      # La misma versión que pre-commit y el grupo dev del pyproject
      - run: pip install ruff==0.17.0
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      # Sin pytest todavía: tests/ solo tiene el .gitkeep y pytest falla sin tests
      - name: Construir la imagen
        run: docker build --tag epf-spain:ci .

  desplegar:
    needs: comprobaciones
    # El push a main y el lanzamiento manual sobre main; nunca un PR ni otra rama
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # El gancho vive en el entorno production, que GitHub limita a main
    environment:
      name: production
      url: https://epf-spain.onrender.com
    # Un despliegue detrás de otro, sin cancelar el que ya está en marcha
    concurrency:
      group: desplegar
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # Sin el secret del entorno, rojo: antes se saltaba en verde y no te enterabas
      - name: Llamar al gancho de Render
        # ref: el commit que acaba de pasar las comprobaciones, no el último de main.
        # --fail pone el trabajo en rojo si Render no responde 2xx; la URL no se imprime
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta RENDER_DEPLOY_HOOK_URL en el entorno production"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
