name: sepf

services:
  db:
    image: "postgres:18"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    image: sepf-web:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - backend
    ports:
      - 127.0.0.1:8000:8000

volumes:
  pgdata:

networks:
  backend:
