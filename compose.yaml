name: sepf

services:
  db:
    image: "postgres:18"
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  backend:
