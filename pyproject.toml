[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epf-spain"
version = "0.1.0"
description = "Daily day-ahead electricity price forecasts for Spain, D+2 to D+7, with uncertainty."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Iván Calvo Rodríguez" }]
dependencies = ["fastapi==0.158.0", "uvicorn==0.54.0"]

[project.scripts]
epf-web = "epf_spain.web:main"

[project.optional-dependencies]
dev = ["ruff==0.17.0", "pre-commit==4.7.0"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
